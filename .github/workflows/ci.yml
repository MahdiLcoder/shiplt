name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuYWNjb3VudHMuZGV2JA
          CLERK_SECRET_KEY: sk_test_ci_build_only
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          CLERK_WEBHOOK_SIGNING_SECRET: ci-build-only
          SHIPIT_WEBHOOK_SECRET: ci-build-only-placeholder-012345678901234567890123456
        run: pnpm build

  publish-image:
    name: Publish image to GHCR
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      image_digest: ${{ steps.publish.outputs.image_digest }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the public Clerk key
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ]; then
            echo "Set the NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY repository variable before publishing images."
            exit 1
          fi

      - name: Create a Buildx builder
        run: docker buildx create --name shiplt-builder --driver docker-container --use

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish the image
        id: publish
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=( --tag "$image:sha-$GITHUB_SHA" )

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tags+=( --tag "$image:latest" )
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=( --tag "$image:$GITHUB_REF_NAME" )
          fi

          docker buildx build \
            --build-arg "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" \
            "${tags[@]}" \
            --metadata-file "$RUNNER_TEMP/image-metadata.json" \
            --push .

          digest="$(jq -r '.["containerimage.digest"] // empty' "$RUNNER_TEMP/image-metadata.json")"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Buildx did not return a valid image digest."
            exit 1
          fi
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy production to Kubernetes
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78e929633b69e8 # v4.0.1

      - name: Deploy and report rollout status to ShipIt
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          SHIPIT_WEBHOOK_URL: ${{ vars.SHIPIT_WEBHOOK_URL }}
          SHIPIT_WEBHOOK_SECRET: ${{ secrets.SHIPIT_WEBHOOK_SECRET }}
          SHIPIT_PROJECT_SLUG: ${{ vars.SHIPIT_PROJECT_SLUG }}
          IMAGE_REF: ghcr.io/${{ github.repository }}@${{ needs.publish-image.outputs.image_digest }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: ./deploy/kubernetes/deploy-with-events.sh
